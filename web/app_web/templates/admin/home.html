{% extends 'admin/master.html' %}

{% block body %}
<style>
  #home-profiles { display: grid; gap: 10px; }
  .home-profile { display: flex; flex-wrap: wrap; justify-content: space-between;
    gap: 12px 24px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
  .home-profile-name { display: inline; font-weight: bold; overflow-wrap: anywhere; }
  .home-profile-progress { display: inline-block; width: 20px; color: #667085; }
  .home-profile[data-progress="checked"] .home-profile-progress { color: #26834c; }
  .home-profile[data-progress="active"] { border-color: #2677bc; background: #f2f7ff; }
  .home-profile[data-progress="active"] .home-profile-progress { color: #245cab; }
  .home-downloading { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #245cab; }
  .home-subscribers, .home-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; }
  .home-subscribers { margin-top: 5px; }
  .home-subscriber { padding: 1px 8px; background: #eef2f5; border-radius: 12px; }
  .home-media { display: grid; gap: 4px; }
  .home-media-row { display: grid; grid-template-columns: 20px repeat(10, 24px);
    align-items: center; justify-items: center; }
  .home-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
  a.home-dot:hover, a.home-dot:focus-visible { outline: 2px solid #333; outline-offset: 2px; }
  .home-sent { background: #26834c; }
  .home-ready { background: #2677bc; }
  .home-pending { background: #e4ad13; }
  .home-error { background: #cf3f43; }
  .home-more { font-size: 11px; padding: 0 2px; }
  .home-legend { margin-top: 16px; }
  .home-activity { display: inline-flex; align-items: baseline; gap: 6px;
    margin-left: 5px; padding: 4px 10px; border-radius: 14px;
    background: #eef1f4; color: #475467; }
  .home-activity[data-state="sleeping"] { background: #203657; color: #f1f5ff; }
  .home-activity[data-state="pause"] { background: #eaf1fb; color: #244871; }
  .home-activity[data-state="profile"] { background: #e0f3ed; color: #185b47; }
  .home-activity[data-state="download"] { background: #efeafa; color: #584084; }
  .home-activity[data-state="starting"] { background: #ffdf76; color: #614700; }
  .home-activity[data-state="waiting_auth"] { background: #fff1ce; color: #744800; }
  .home-activity a { color: inherit; text-decoration: underline; }
  .home-legend .home-dot, #home-story-list .home-dot { margin-right: 5px; }
  #home-stories { width: min(92vw, 580px); max-height: 80vh; border: 1px solid #ddd; border-radius: 6px; }
  #home-stories::backdrop { background: #0006; }
  #home-story-list { padding-left: 22px; overflow-wrap: anywhere; }
  @media (max-width: 420px) {
    .home-media-row { grid-template-columns: 18px repeat(10, 19px); }
  }
</style>

<h2>Профили</h2>
<p><strong>Парсер</strong> <span id="home-parser-activity" class="home-activity">
  <span id="home-activity-icon" aria-hidden="true">○</span>
  <span id="home-activity-text" role="status">Статус недоступен</span>
</span></p>
<p id="home-status" role="status">Загрузка…</p>
<div id="home-profiles"></div>
<div class="home-legend">
  <span><i class="home-dot home-sent"></i>Отправлено</span>
  <span><i class="home-dot home-ready"></i>Ожидает отправки</span>
  <span><i class="home-dot home-pending"></i>Ожидает скачивания</span>
  <span><i class="home-dot home-error"></i>Ошибка скачивания</span>
</div>
<dialog id="home-stories" aria-labelledby="home-story-title">
  <form method="dialog"><button class="close" aria-label="Закрыть">×</button></form>
  <h3 id="home-story-title"></h3>
  <ol id="home-story-list"></ol>
</dialog>

<script>
(() => {
  const endpoint = {{ url_for('.home_data') | tojson }};
  const profiles = document.getElementById('home-profiles');
  const status = document.getElementById('home-status');
  const activityNode = document.getElementById('home-parser-activity');
  const activityIcon = document.getElementById('home-activity-icon');
  const activityText = document.getElementById('home-activity-text');
  const activityIcons = {
    starting: 'glyphicon-off',
    waiting_auth: 'glyphicon-lock',
    sleeping: 'moon',
    pause: 'glyphicon-time',
    profile: 'glyphicon-user',
    download: 'glyphicon-download-alt',
  };
  const dialog = document.getElementById('home-stories');
  const storyList = document.getElementById('home-story-list');
  const rows = new Map();
  const moscowTime = new Intl.DateTimeFormat('ru-RU', {
    timeZone: 'Europe/Moscow',
    hour: '2-digit',
    minute: '2-digit',
  });
  const moscowDate = new Intl.DateTimeFormat('ru-RU', {
    timeZone: 'Europe/Moscow',
    day: 'numeric',
    month: 'long',
  });
  const labels = {
    sent: 'Отправлено',
    ready: 'Ожидает отправки',
    pending: 'Ожидает скачивания',
    error: 'Ошибка скачивания',
  };
  const media = {
    post: ['▧', 'Посты'],
    reel: ['▶', 'Рилсы'],
    story: ['◷', 'Сторис'],
  };
  let openProfile = null;
  let storySignature = '';
  let activitySignature = '';

  function element(tag, className, value = '') {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = value;
    return node;
  }

  function instagramLink(url, className, label = '') {
    if (!/^https?:\/\/(?:www\.)?instagram\.com\/(?:[\w.]+\/)?(?:p|reel|stories)\//i.test(url)) {
      return element('span', className, label);
    }
    const node = element('a', className, label);
    node.href = url;
    node.target = '_blank';
    node.rel = 'noopener noreferrer';
    return node;
  }

  function dot(item, downloadUrl) {
    const node = instagramLink(item.label, 'home-dot home-' + item.status);
    node.title = labels[item.status] + ' · ' + item.label;
    if (item.label === downloadUrl) {
      node.classList.add('home-downloading');
      node.title = 'Скачиваем · ' + item.label;
    }
    if (node.tagName === 'SPAN') node.setAttribute('role', 'img');
    node.setAttribute('aria-label', node.title);
    return node;
  }

  function renderActivity(activity) {
    const signature = JSON.stringify(activity);
    if (signature === activitySignature) return;
    activitySignature = signature;
    const icon = activityIcons[activity?.state];
    activityNode.dataset.state = icon ? activity.state : '';
    activityIcon.className = icon && icon !== 'moon' ? 'glyphicon ' + icon : '';
    activityIcon.textContent = icon === 'moon' ? '☾' : icon ? '' : '○';
    switch (activity?.state) {
      case 'starting':
        activityText.textContent = 'Запускаемся';
        break;
      case 'waiting_auth':
        activityText.textContent = 'Ожидаем авторизации Instagram';
        break;
      case 'sleeping':
      case 'pause': {
        const label = activity.state === 'sleeping' ? 'Спим' : 'Пауза';
        if (!Number.isFinite(activity.until)) {
          activityText.textContent = label;
          break;
        }
        const until = new Date(activity.until * 1000);
        const date = moscowDate.format(until);
        const day = date === moscowDate.format(new Date()) ? '' : date + ', ';
        activityText.textContent = label + ' до ' + day + moscowTime.format(until) + ' МСК';
        break;
      }
      case 'profile':
        activityText.textContent = 'Актуализируем профиль @' + activity.username;
        break;
      case 'download': {
        const label = { post: 'пост', reel: 'рилс', story: 'сторис' }[activity.media_type] || 'медиа';
        activityText.replaceChildren('Скачиваем ', instagramLink(activity.url, '', label), ' от @' + activity.username);
        break;
      }
      default:
        activityText.textContent = 'Статус недоступен';
    }
  }

  function elapsed(seconds) {
    if (seconds === null) return 'Ещё не проверялся';
    if (seconds < 60) return 'Проверен меньше минуты назад';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return 'Проверен ' + minutes + ' мин назад';
    if (minutes < 1440) return 'Проверен ' + Math.floor(minutes / 60) + ' ч назад';
    return 'Проверен ' + Math.floor(minutes / 1440) + ' дн назад';
  }

  function renderStories(profile, download) {
    const downloadUrl = download?.media_type === 'story' ? download.url : null;
    const signature = JSON.stringify([profile.username, profile.story, downloadUrl]);
    if (signature === storySignature) return;
    storySignature = signature;
    document.getElementById('home-story-title').textContent = 'Сторис @' + profile.username + ' за 24 часа';
    storyList.replaceChildren(...profile.story.map(item => {
      const entry = element('li', '');
      entry.append(dot(item, downloadUrl), labels[item.status] + ' · ' + item.label);
      return entry;
    }));
  }

  function updateRow(profile, row) {
    const age = elapsed(profile.checked_seconds);
    if (row.age.textContent !== age) row.age.textContent = age;
    const signature = JSON.stringify([
      profile.username, profile.subscribers, profile.post, profile.reel,
      profile.story.slice(0, 10), profile.story.length, row.download,
      profile.story.some(item => item.label === row.download?.url),
    ]);
    if (row.signature === signature) return;
    row.signature = signature;
    row.name.textContent = '@' + profile.username;
    row.subscribers.replaceChildren(...profile.subscribers.map(name => element('span', 'home-subscriber', name)));
    row.media.replaceChildren(...Object.entries(media).filter(([type]) => profile[type].length).map(([type, [icon, label]]) => {
      const line = element('div', 'home-media-row');
      const heading = element('span', '', icon);
      heading.title = label;
      heading.setAttribute('role', 'img');
      heading.setAttribute('aria-label', label);
      const items = profile[type];
      const overflow = items.length > 10;
      const downloadUrl = row.download?.media_type === type ? row.download.url : null;
      const visibleCount = overflow ? 9 : 10;
      line.append(heading, ...items.slice(0, visibleCount).map(item => dot(item, downloadUrl)));
      if (overflow) {
        const more = element('button', 'btn btn-default home-more', '+' + (items.length - 9));
        more.type = 'button';
        more.setAttribute('aria-label', 'Все сторис за 24 часа');
        if (items.slice(visibleCount).some(item => item.label === downloadUrl)) {
          more.classList.add('home-downloading');
          more.title = 'В списке есть сторис, которая сейчас скачивается';
          more.setAttribute('aria-label', 'Все сторис за 24 часа. Одна из скрытых сторис скачивается.');
        }
        more.addEventListener('click', () => {
          openProfile = profile.id;
          renderStories(row.profile, row.download);
          dialog.showModal();
        });
        line.append(more);
      }
      return line;
    }));
  }

  function render(data, activity) {
    const seen = new Set();
    const checked = new Set(activity?.checked_profiles?.map(name => name.toLowerCase()));
    const current = activity?.username?.toLowerCase();
    data.forEach((profile, index) => {
      seen.add(profile.id);
      let row = rows.get(profile.id);
      if (!row) {
        row = {
          node: element('section', 'home-profile'),
          name: element('div', 'home-profile-name'),
          progress: element('span', 'home-profile-progress'),
          age: element('div', 'text-muted'),
          subscribers: element('div', 'home-subscribers'),
          media: element('div', 'home-media'),
        };
        const info = element('div', '');
        const heading = element('div', '');
        heading.append(row.progress, row.name);
        info.append(heading, row.age, row.subscribers);
        row.node.append(info, row.media);
        rows.set(profile.id, row);
      }
      row.profile = profile;
      const username = profile.username.toLowerCase();
      const active = username === current && ['profile', 'download'].includes(activity?.state);
      const done = checked.has(username);
      row.download = active && activity.state === 'download'
        ? { media_type: activity.media_type, url: activity.url } : null;
      const progress = active ? 'active' : done ? 'checked' : 'pending';
      const currentAction = active ? activity.state : '';
      if (row.node.dataset.progress !== progress || row.progress.dataset.activity !== currentAction) {
        row.node.dataset.progress = progress;
        row.progress.dataset.activity = currentAction;
        const icon = active ? activityIcons[activity.state] : done ? 'glyphicon-ok' : 'glyphicon-time';
        const label = active ? 'Парсер сейчас работает с этим профилем'
          : done ? 'Проверен в этой итерации' : 'Ещё не проверен в этой итерации';
        row.progress.className = 'home-profile-progress glyphicon ' + icon;
        row.progress.title = label;
        row.progress.setAttribute('role', 'img');
        row.progress.setAttribute('aria-label', label);
      }
      updateRow(profile, row);
      if (profiles.children[index] !== row.node) {
        profiles.insertBefore(row.node, profiles.children[index] || null);
      }
      if (dialog.open && openProfile === profile.id) renderStories(profile, row.download);
    });
    for (const [id, row] of rows) {
      if (!seen.has(id)) {
        if (dialog.open && id === openProfile) dialog.close();
        row.node.remove();
        rows.delete(id);
      }
    }
    status.hidden = data.length > 0;
    if (!data.length) status.textContent = 'Профилей пока нет.';
  }

  async function refresh() {
    try {
      const response = await fetch(endpoint, { cache: 'no-store' });
      if (!response.ok || response.redirected) throw new Error('Home request failed');
      const data = await response.json();
      renderActivity(data.parser_activity);
      render(data.profiles, data.parser_activity);
    } catch (error) {
      if (!rows.size) {
        status.hidden = false;
        status.textContent = 'Не удалось загрузить профили. Повторим автоматически.';
      }
    } finally {
      window.setTimeout(refresh, 5000);
    }
  }

  refresh();
})();
</script>
{% endblock %}
