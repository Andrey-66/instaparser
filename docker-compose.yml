services:
  # ============= PostgreSQL =============
  postgres-db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: instauser
      POSTGRES_PASSWORD: instapass
      POSTGRES_DB: instadb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 130m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instauser -d instadb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - backend
    command: >
      postgres
      -c shared_buffers=16MB
      -c max_connections=10
      -c work_mem=1MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=64MB

  # ============= Flask API (web) =============
  flask-api:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://instauser:instapass@postgres-db:5432/instadb
      - FLASK_APP=app_web.app
      - INITIAL_ADMIN_PASSWORD
      - SECRET_KEY
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./content:/content
      - ./web/migrations:/app/migrations
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - backend
    command: ["python", "run.py"]

  # ============= Parser =============
  parser:
    build:
      context: ./parser
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - URL=http://flask-api:5000
      - EMAILS
      - PASSWORDS
      - SECRETS
      - TELEGRAM_TOKEN=${TOKEN}
      - ADMIN_TELEGRAM_ID
      - SERVER_URL
    ports:
      - "6080:6080"
    depends_on:
      - flask-api
    volumes:
      - ./content:/content
    restart: on-failure
    # Свопа на хосте нет (free -h: Swap 0B) — своп-трэшинг был неверной
    # гипотезой, и OOM-килла в момент зависаний 22.07 тоже не было (journalctl
    # -k пуст), т.е. упор был не в память. Лимит здесь — просто защитный
    # потолок при total ~1.7ГБ (см. free -h), чтобы Chrome не мог вытеснить
    # остальные сервисы, если реальная причина зависаний всё же когда-нибудь
    # проявится как утечка памяти. memswap_limit = mem_limit, чтобы при
    # достижении потолка cgroup убивал процесс сразу, а не давал ему повиснуть.
    mem_limit: 950m
    memswap_limit: 950m
    networks:
      - backend
    command: ["sh", "/app/restart_wrapper.sh"]

  # ============= Telegram Bot =============
  telegram-bot:
    build:
      context: ./telegram
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - TOKEN
      - URL=http://flask-api:5000
      - ADMIN_TELEGRAM_ID
    depends_on:
      - flask-api
    volumes:
      - ./content:/content
    restart: unless-stopped
    # 256m ещё раз не хватило на буферизацию крупного reel при отправке
    # (send_content держит видео в памяти целиком) — точный сигнатурный
    # SIGKILL ~22с в run.py, тот же паттерн, что уже чинили. 512m с запасом
    # покрывает один reel (Telegram Bot API и так режет файлы >50MB).
    # Внимание: сумма всех mem_limit в этом файле (130+256+950+512+50=1898m)
    # уже больше реальных ~1.7ГБ хоста — это осознанный оверсабскрайб
    # (лимиты это потолки, а не резервирование, сервисы редко пикуют
    # одновременно), но если когда-нибудь пиканут все разом — хостовый
    # OOM-killer может убить не telegram-bot, а любой другой процесс
    # непредсказуемо. Страховка от бесконечного спама на этот случай —
    # errors_count/MAX_SEND_ATTEMPTS в telegram/run.py, а не память сама
    # по себе.
    mem_limit: 512m
    networks:
      - backend

  # ============= Dozzle =============
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_ENABLE_ACTIONS=true
    secrets:
      - source: users
        target: /data/users.yml
    ports:
      - "8080:8080"
    mem_limit: 50m
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge

secrets:
  users:
    file: users.yml